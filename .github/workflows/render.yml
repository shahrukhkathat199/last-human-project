name: Render Last Human Short

on:
  workflow_dispatch:
    inputs:
      render_scale:
        description: 'Render scale (0.5 = half-res, 1.333 = 2K)'
        required: false
        default: '0.5'
        type: choice
        options:
          - '0.5'
          - '1.333'
      concurrency:
        description: 'Number of parallel renders'
        required: false
        default: '4'
        type: choice
        options:
          - '2'
          - '4'
          - '8'

jobs:
  render:
    name: Render Video
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system dependencies for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64 \
            ffmpeg

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Render video (preview)
        if: github.event.inputs.render_scale == '0.5'
        run: |
          npx remotion render src/index.ts LastHumanShort out/preview.mp4 \
            --gl=angle \
            --concurrency=2 \
            --crf=23 \
            --scale=0.5

      - name: Render video (2K)
        if: github.event.inputs.render_scale == '1.333'
        run: |
          npx remotion render src/index.ts LastHumanShort out/last-human.mp4 \
            --codec=h264 \
            --crf=16 \
            --scale=1.3333333333333333 \
            --timeout=300000

      - name: Upload preview artifact
        if: github.event.inputs.render_scale == '0.5'
        uses: actions/upload-artifact@v4
        with:
          name: last-human-preview
          path: out/preview.mp4
          retention-days: 7

      - name: Upload 2K artifact
        if: github.event.inputs.render_scale == '1.333'
        uses: actions/upload-artifact@v4
        with:
          name: last-human-2k
          path: out/last-human.mp4
          retention-days: 7