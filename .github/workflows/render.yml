name: Render Last Human Short

on:
  workflow_dispatch:
    inputs:
      scale:
        description: 'Render scale (1 = 1080x1920, 1.3333333333333333 = 1440x2560)'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '1.3333333333333333'
          - '0.5'
      gl:
        description: 'WebGL renderer (swangle = software, works without GPU)'
        required: false
        default: 'swangle'
        type: choice
        options:
          - 'swangle'
          - 'angle'
          - 'angle-egl'
          - 'egl'
      concurrency:
        description: 'Parallel render workers'
        required: false
        default: '4'
        type: choice
        options:
          - '2'
          - '4'
          - '8'

jobs:
  render:
    name: Render Video
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system dependencies for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libcairo2 \
            ffmpeg xvfb

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Ensure render browser
        run: npx remotion browser ensure

      - name: Render video
        env:
          SCALE: ${{ github.event.inputs.scale }}
          GL: ${{ github.event.inputs.gl }}
          CONC: ${{ github.event.inputs.concurrency }}
        run: |
          set -o pipefail
          echo "scale=$SCALE gl=$GL concurrency=$CONC"
          if xvfb-run -a -s "-screen 0 1920x2560x24" \
              npx remotion render src/index.ts LastHumanShort out/last-human.mp4 \
                --codec=h264 --crf=20 --scale="$SCALE" --concurrency="$CONC" \
                --gl="$GL" --timeout=300000 --log=info; then
            echo "render ok with $GL"
          else
            echo "::warning::render failed with gl=$GL, retrying with swangle/2"
            xvfb-run -a -s "-screen 0 1920x2560x24" \
              npx remotion render src/index.ts LastHumanShort out/last-human.mp4 \
                --codec=h264 --crf=20 --scale="$SCALE" --concurrency=2 \
                --gl=swangle --timeout=300000 --log=info
          fi

      - name: Verify output
        run: |
          ls -la out/
          ffprobe -v error -show_entries stream=index,codec_type,codec_name,width,height,duration \
            -of default=noprint_wrappers=1 out/last-human.mp4

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-human-${{ github.event.inputs.scale }}
          path: out/last-human.mp4
          if-no-files-found: warn
          retention-days: 7
